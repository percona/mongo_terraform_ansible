# Note:
# Consider overriding all the following variables at Ansible runtime via --extra-vars
# - keyfile_content
# - mongo_root_password
# - pmm_server_pwd
# - mongodb_pmm_user_pwd
# - pbmpwd
# - access_key_id (used for accesing S3 bucket for Backups)
# - secret_access_key (used for accesing S3 bucket for Backups)
# - encryption_key_content (if using encryption at rest)
# - vault_tokenfile_content (if using Hashicorp Vault)

#########################
## General configuration
#########################

ansible_python_interpreter: /usr/bin/python3

# MongoDB package distribution for non-Docker deployments: psmdb, community, or enterprise.
# Keep defaults behind effective vars so inventory/UI selections can override them.
mongodb_distribution_default: psmdb
mongodb_distribution_effective: "{{ mongodb_distribution | default(mongodb_distribution_default, true) | trim }}"

# MongoDB version/release line. For PSMDB this is the percona-release repo name
# (for example psmdb-80). For MongoDB Community/Enterprise this is the official
# MongoDB repo line (for example 8.0 or 8.3).
# Availability depends on the OS version.
#mongo_release_default: psmdb-70
mongo_release_default: psmdb-80
mongo_release_effective: "{{ mongo_release | default(mongo_release_default, true) | trim }}"
mongo_repo_default: release
mongo_repo_effective: "{{ mongo_repo | default(mongo_repo_default, true) | trim }}"

# We can also use perconalab/pmm-server-fb:PR-number-hash or perconalab/pmm-server:dev-latest. In that case set experimental to true.
#pmm_image: perconalab/pmm-server:3-dev-latest
pmm_image: docker.io/percona/pmm-server:latest
#pmm_image: docker.io/percona/pmm-server:3

#pmm_client_repo: pmm2-client experimental
#pmm_client_repo: pmm2-client
pmm_client_repo: pmm3-client
pbm_repo: release

#########################
## Package sources
#########################

mongodb_psmdb_mongod_packages:
  - percona-server-mongodb
  - percona-mongodb-mongosh
mongodb_psmdb_mongod_versioned_packages:
  - percona-server-mongodb
  - percona-mongodb-mongosh

mongodb_psmdb_mongos_packages:
  - percona-server-mongodb-mongos
  - percona-mongodb-mongosh
mongodb_psmdb_mongos_versioned_packages:
  - percona-server-mongodb-mongos
  - percona-mongodb-mongosh

mongodb_community_mongod_packages:
  - mongodb-org
  - mongodb-mongosh
mongodb_community_mongod_versioned_packages:
  - mongodb-org
  - mongodb-org-database
  - mongodb-org-server
  - mongodb-org-mongos
  - mongodb-org-tools
  - mongodb-mongosh

mongodb_community_mongos_packages:
  - mongodb-org-mongos
  - mongodb-mongosh
mongodb_community_mongos_versioned_packages:
  - mongodb-org-mongos
  - mongodb-mongosh

mongodb_enterprise_mongod_packages:
  - mongodb-enterprise
  - mongodb-mongosh
mongodb_enterprise_mongod_versioned_packages:
  - mongodb-enterprise
  - mongodb-enterprise-database
  - mongodb-enterprise-server
  - mongodb-enterprise-mongos
  - mongodb-enterprise-tools
  - mongodb-mongosh

mongodb_enterprise_mongos_packages:
  - mongodb-enterprise-mongos
  - mongodb-mongosh
mongodb_enterprise_mongos_versioned_packages:
  - mongodb-enterprise-mongos
  - mongodb-mongosh

mongod_packages: "{{ lookup('vars', 'mongodb_' ~ mongodb_distribution_effective ~ '_mongod_packages') }}"
mongod_versioned_packages: "{{ lookup('vars', 'mongodb_' ~ mongodb_distribution_effective ~ '_mongod_versioned_packages') }}"
mongos_packages: "{{ lookup('vars', 'mongodb_' ~ mongodb_distribution_effective ~ '_mongos_packages') }}"
mongos_versioned_packages: "{{ lookup('vars', 'mongodb_' ~ mongodb_distribution_effective ~ '_mongos_versioned_packages') }}"

mongo_os_user: "{{ 'mongodb' if mongodb_distribution_effective in ['community', 'enterprise'] and ansible_facts['os_family'] == 'Debian' else 'mongod' }}"
mongo_os_group: "{{ mongo_os_user }}"

pbm_package:
  - percona-backup-mongodb

pmm_client_package:
  - pmm-client

disable_telemetry: false

# Percona ClusterSync is provisioned only when the inventory contains [pcsm].
pcsm_version: "0.9.0"
pcsm_repo: release

# Pinned upstream YCSB source revision. The current 0.17 release bundles a
# MongoDB Java driver too old for PSMDB 8.3 authentication behavior.
ycsb_source_revision: 66302f301b13f60d4bcb2f29f478586bb1d6f2e0
ycsb_maven_version: 3.6.3

##########
# MongoDB 
##########

mongo_admin_user: root
# Warning! This is just an example, replace with your own for prod use!
mongo_admin_password: percona

########################
## LDAP Authentication
########################

# LDAP values are supplied by a generated inventory when a topology selects an
# LDAP server. Keeping them out of group_vars lets the inventory take effect.

mongod_log_path: /var/log/mongo/
mongod_path: /var/lib/mongo/
mongod_pid_path: "{{ '/var/run/mongodb/mongod.pid' if mongodb_distribution_effective in ['community', 'enterprise'] else '/var/run/mongod.pid' }}"
enable_audit: false
audit_log_path: /var/log/mongo/auditLog.json

# MongoDB Search / Vector Search (mongot) experimental support.
enable_mongot_default: false
enable_mongot_effective: "{{ enable_mongot | default(enable_mongot_default, true) | bool }}"
mongot_version_default: "1.70.3-1"
mongot_version_effective: "{{ mongot_version | default(mongot_version_default, true) | trim }}"
mongot_source_requested: "{{ mongot_source | default('auto', true) | trim }}"
mongot_source_effective: "{{ 'percona_package' if mongot_source_requested == 'percona_package' or (mongot_source_requested == 'auto' and mongodb_distribution_effective == 'psmdb' and mongo_release_effective == 'psmdb-83') else 'community_tarball' }}"
percona_search_effective: "{{ enable_mongot_effective | bool and mongot_source_effective == 'percona_package' }}"
mongot_repo_default: release
mongot_repo_effective: "{{ mongot_repo | default(mongot_repo_default, true) | trim }}"
mongot_package: percona-search-mongodb
mongot_port: 27028
mongot_metrics_port: 9946
mongot_health_port: 8080
mongot_user: "{{ mongo_os_user if percona_search_effective else 'mongot' }}"
mongot_group: "{{ mongo_os_group if percona_search_effective else 'mongot' }}"
mongot_binary: "{{ '/usr/bin/mongot' if percona_search_effective else '/opt/mongot-community/mongot' }}"
mongot_config_file: "{{ '/etc/mongot/mongot.yml' if percona_search_effective else '/etc/mongot/config.yml' }}"
mongot_config_dir: /etc/mongot
mongot_data_path: /var/lib/mongot
mongot_log_path: /var/log/mongot/mongot.log
mongot_password_file: "{{ mongot_config_dir ~ '/secrets/passwordFile' }}"
mongodb_mongot_user: mongotUser
mongodb_mongot_password: percona

# Default audit policy: log successful write authorization checks for non-system users.
# Override audit_filter per deployment or via --extra-vars when needed.
audit_filter: '{ atype: "authCheck", "param.command": { $in: [ "insert", "update", "delete", "findandmodify" ] }, "users.user": { $not: /^__/ } }'

thp_location: /usr/lib/systemd/system/disable-thp.service

########################
## Member Authentication
########################

# use_tls: true/false. Controls if Mongo uses keyfile or x509 certificates for member authentication. Also controls if clients need to use TLS to connect.
use_tls: false

# keyFile is only relevant if use_tls: false. Run `openssl rand -base64 741` to generate a new key
keyFile_location: /etc/mongod_keyfile

# Warning! This is just an example, replace with your own for prod use!
keyfile_content: |
  8pYcxvCqoe89kcp33KuTtKVf5MoHGEFjTnudrq5BosvWRoIxLowmdjrmUpVfAivh
  CHjqM6w0zVBytAxH1lW+7teMYe6eDn2S/O/1YlRRiW57bWU3zjliW3VdguJar5i9

# The next 3 options are only relevant if use_tls: true
certificateKeyFile: /etc/ssl/server.pem
clientCertificateKeyFile: /etc/ssl/client.pem
CAFile: /etc/ssl/test-ca.pem

##########################
## Data-at-rest Encryption
##########################

# keyfile_encryption: true/false
keyfile_encryption: false
# Warning! This is just an example, replace with your own for prod use!
encryption_key_content: |
  vvMTZ3dnSbG7wc6DkPpt+rp3Cc+jF8lJsYlq6QE1yEM=
# path to the keyfile to encrypt
encryption_keyfile: /opt/mongodb.key

# vault_encryption: true/false - set to true to use Hashicorp Vault instead of local keyfile
vault_encryption: false
vault_server: vault.example.com
vault_port: 8200
# path to the token used by MongoDB to access Vault
vault_tokenfile: /etc/mongodb/token
vault_cafile: /etc/mongodb/vault.crt
# path to the secret within Vault
vault_secret: secret/data/dc/psmongodb1

##############
# Vault Server
##############

vault_config_path: /etc/vault.d/vault.hcl
root_token: |
  s.uTrHtzsZnEE7KyHeA797CkWA
mongodb_policy_name: "mongodb-policy"
mongodb_policy_hcl: |
  path "secret/data/dc/*" {
    capabilities = ["create", "read", "update", "delete", "list"]
  }
  path "secret/metadata/*" {
    capabilities = ["read"]
  }
  path "secret/config" {
    capabilities = ["read"]
  }
mongodb_token_ttl: "30d"

##################
## Monitoring
##################

# For PMM 3 pmm_port is 8443. For PMM 2 it is 443
#pmm_port: 443
pmm_port: 8443
pmm_external_port: 8443

# PMM server parameters
pmm_dir: /var/lib/docker
pmm_server_user: admin
# Warning! This is just an example, replace with your own for prod use!
pmm_server_pwd: admin

# PMM agent parameters
mongodb_pmm_user: pmm
# Warning! This is just an example, replace with your own for prod use!
mongodb_pmm_user_pwd: percona

# Warning! This is just an example, replace with your own for prod use!
watchtower_token: 89220f28d5017b6a5806a7c589485c2b

#env_tag: test

# The pmm-admin --cluster argument is only applicable for sharded clusters.
# The cluster name is automatically put into the inventory file generated by Terraform.
# If not provisioning servers with Terraform uncomment the following line and provide the desired cluster name here:
#
#cluster: dev

###############
## Backup
###############
  
# PBM database user and password
pbmuser: pbm
# Warning! This is just an example, replace with your own for prod use!
pbmpwd: secretpwd
# also can be logical
pbm_backup_type: physical
# how long to keep backups
pbm_retention_days: 3
# use for the cron job with backup time
pbm_backup_hour: 0
pbm_backup_minute: 2
pbm_purge_hour: 0
pbm_purge_minute: 2
# older pbm versions used a dedicated pbm user
pbm_os_user: "{{ mongo_os_user }}"

pbm_config_path: /etc/pbm-storage.conf

# backup location - use 'filesystem' for locally mounted NFS drive. For cloud storage use gcs, azure or s3
#storage_provider: filesystem

# only relevant if for storage_provider: filesystem
pbm_path: /backup

# Below options are only relevant if you are using storage_provider != filesystem
#
# A custom prefix for the directory structure created by pbm inside the storage bucket. By default the cluster name is used.
#prefix: pbm
#
# The region, bucket, endpoint and keys are put into the inventory file by Terraform. If not provisioning servers with Terraform uncomment the following lines and modify as needed:
#
#region: northamerica-northeast1
#bucket: dev-mongo-backups
#endpointUrl: https://storage.googleapis.com
#
# the access and secret access keys are best provided via --extra-vars at runtime to avoid exposing them in the inventory file
#access_key_id: *****
#secret_access_key: *****
