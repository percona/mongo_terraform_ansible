---
- name: Configure PMM server
  hosts: pmm
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  tags: pmm_server
  become: true
  vars:
    pmm_enabled: "{{ enable_pmm | default((groups['pmm'] | default([]) | length) > 0) | bool }}"
    pmm_image_refs:
      watchtower: "{{ watchtower_image | default('percona/watchtower:latest') }}"
      renderer: "{{ renderer_image | default('grafana/grafana-image-renderer:latest') }}"
      server: "{{ pmm_image }}"
  tasks:
    - name: Load OS-specific variables
      include_vars: "vars/{{ ansible_facts['os_family'] }}.yml"
      when: pmm_enabled | bool

    - name: Create PMM directory
      file:
        path: "{{ pmm_dir }}"
        state: directory
        owner: root
        group: root
        mode: 0710
      when: pmm_enabled | bool

    - name: Install Docker on Ubuntu
      block:

        - name: Install required packages
          apt:
            name:
              - ca-certificates
              - curl
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create keyrings directory
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Add Docker’s official GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker repository
          apt_repository:
            repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
            filename: docker
            state: present

        - name: Install Docker
          apt:
            name: "{{ docker_packages }}"
            state: present
            update_cache: true
            cache_valid_time: 3600

      when:
        - pmm_enabled | bool
        - ansible_facts['os_family'] == 'Debian'

    - name: Install Docker on RedHat
      block:
        
        - name: Install yum utils
          yum:
            name: yum-utils
            state: present

        - name: add the Docker repository
          shell: yum-config-manager --add-repo {{ docker_repo }}

        - name: Install Docker
          yum:
            name: "{{ docker_packages }}"
            state: present

      when:
        - pmm_enabled | bool
        - ansible_facts['os_family'] == 'RedHat'

    - name: Start Docker
      service:
        name: docker
        state: started
      when: pmm_enabled | bool

    - name: Check if Docker network exists
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - pmm-network
      register: docker_network
      changed_when: false
      failed_when: false
      when: pmm_enabled | bool

    - name: Create Docker network if not exists
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - pmm-network
      when:
        - pmm_enabled | bool
        - docker_network.rc != 0

    - name: Pull PMM container images
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ item }}"
      loop:
        - "{{ pmm_image_refs.watchtower }}"
        - "{{ pmm_image_refs.renderer }}"
        - "{{ pmm_image_refs.server }}"
      register: image_pull
      changed_when: "'Downloaded newer image' in image_pull.stdout"
      when: pmm_enabled | bool

    - name: Get desired local image IDs
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - "{{ item }}"
      loop:
        - "{{ pmm_image_refs.watchtower }}"
        - "{{ pmm_image_refs.renderer }}"
        - "{{ pmm_image_refs.server }}"
      register: desired_images
      changed_when: false
      when: pmm_enabled | bool

    - name: Get Watchtower container image ID
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - "--format={{ '{{.Image}}' }}"
          - watchtower
      register: watchtower_container
      changed_when: false
      failed_when: false
      when: pmm_enabled | bool

    - name: Get renderer container image ID
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - "--format={{ '{{.Image}}' }}"
          - renderer
      register: renderer_container
      changed_when: false
      failed_when: false
      when: pmm_enabled | bool

    - name: Get PMM server container image ID
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - "--format={{ '{{.Image}}' }}"
          - pmm-server
      register: pmm_server_container
      changed_when: false
      failed_when: false
      when: pmm_enabled | bool

    - name: Determine containers requiring recreation
      ansible.builtin.set_fact:
        watchtower_recreate: "{{ watchtower_container.rc != 0 or watchtower_container.stdout != desired_images.results[0].stdout }}"
        renderer_recreate: "{{ renderer_container.rc != 0 or renderer_container.stdout != desired_images.results[1].stdout }}"
        pmm_server_recreate: "{{ pmm_server_container.rc != 0 or pmm_server_container.stdout != desired_images.results[2].stdout }}"
      when: pmm_enabled | bool

    - name: Remove containers using stale images
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - --force
          - "{{ item.name }}"
      loop:
        - name: watchtower
          exists: "{{ watchtower_container.rc == 0 }}"
          recreate: "{{ watchtower_recreate }}"
        - name: renderer
          exists: "{{ renderer_container.rc == 0 }}"
          recreate: "{{ renderer_recreate }}"
        - name: pmm-server
          exists: "{{ pmm_server_container.rc == 0 }}"
          recreate: "{{ pmm_server_recreate }}"
      when:
        - pmm_enabled | bool
        - item.exists | bool
        - item.recreate | bool

    - name: Run Watchtower container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --network=pmm-network
          - --name
          - watchtower
          - --restart
          - always
          - -e
          - "WATCHTOWER_HTTP_API_TOKEN={{ watchtower_token }}"
          - -e
          - WATCHTOWER_HTTP_API_UPDATE=1
          - --volume
          - /var/run/docker.sock:/var/run/docker.sock
          - "{{ pmm_image_refs.watchtower }}"
      when:
        - pmm_enabled | bool
        - watchtower_recreate | bool

    - name: Run Grafana renderer container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --network=pmm-network
          - --name
          - renderer
          - --restart
          - always
          - -e
          - IGNORE_HTTPS_ERRORS=true
          - "{{ pmm_image_refs.renderer }}"
      when:
        - pmm_enabled | bool
        - renderer_recreate | bool

    - name: Check if PMM data volume exists
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - inspect
          - pmm-data
      register: pmm_data_volume
      changed_when: false
      failed_when: false
      when: pmm_enabled | bool

    - name: Create PMM data volume if not exists
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - create
          - pmm-data
      when:
        - pmm_enabled | bool
        - pmm_data_volume.rc != 0

    - name: Run PMM server container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --network=pmm-network
          - --name
          - pmm-server
          - --restart
          - always
          - -p
          - "{{ pmm_external_port }}:{{ pmm_port }}"
          - --volume
          - pmm-data:/srv
          - -e
          - GF_RENDERING_SERVER_URL=http://renderer:8081/render
          - -e
          - "GF_RENDERING_CALLBACK_URL=https://pmm-server:{{ pmm_port }}/graph/"
          - -e
          - PMM_WATCHTOWER_HOST=http://watchtower:8080
          - -e
          - "PMM_WATCHTOWER_TOKEN={{ watchtower_token }}"
          - "{{ pmm_image_refs.server }}"
      when:
        - pmm_enabled | bool
        - pmm_server_recreate | bool

    - name: Wait until PMM server is healthy
      uri:
        url: "https://127.0.0.1:{{ pmm_external_port }}/v1/readyz"
        method: GET
        validate_certs: no  # set to 'yes' if using valid TLS certs
      register: pmm_ready
      until: pmm_ready.status == 200
      retries: 20
      delay: 2
      when: pmm_enabled | bool

    - name: Configure PMM server admin password
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -t
          - pmm-server
          - change-admin-password
          - "{{ pmm_server_pwd }}"
      when:
        - pmm_enabled | bool
        - pmm_server_recreate | bool
