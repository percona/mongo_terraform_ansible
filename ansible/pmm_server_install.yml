---
- name: Configure PMM server
  hosts: pmm
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  tags: pmm_server
  become: true
  vars:
    pmm_enabled: "{{ enable_pmm | default((groups['pmm'] | default([]) | length) > 0) | bool }}"
  tasks:
    - name: Load OS-specific variables
      include_vars: "vars/{{ ansible_facts['os_family'] }}.yml"
      when: pmm_enabled | bool

    - name: Create PMM directory
      file:
        path: "{{ pmm_dir }}"
        state: directory
        owner: root
        group: root
        mode: 0710
      when: pmm_enabled | bool

    - name: Install Docker on Ubuntu
      block:

        - name: Install required packages
          apt:
            name:
              - ca-certificates
              - curl
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create keyrings directory
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Add Docker’s official GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker repository
          apt_repository:
            repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
            filename: docker
            state: present

        - name: Install Docker
          apt:
            name: "{{ docker_packages }}"
            state: present
            update_cache: true
            cache_valid_time: 3600

      when:
        - pmm_enabled | bool
        - ansible_facts['os_family'] == 'Debian'

    - name: Install Docker on RedHat
      block:
        
        - name: Install yum utils
          yum:
            name: yum-utils
            state: present

        - name: add the Docker repository
          shell: yum-config-manager --add-repo {{ docker_repo }}

        - name: Install Docker
          yum:
            name: "{{ docker_packages }}"
            state: present

      when:
        - pmm_enabled | bool
        - ansible_facts['os_family'] == 'RedHat'

    - name: Start Docker
      service:
        name: docker
        state: started
      when: pmm_enabled | bool

    - name: Check if Docker network exists
      command: docker network ls --filter name=^pmm-network$ --format '{{ "{{.Name}}" }}'
      register: docker_networks
      when: pmm_enabled | bool

    - name: Create Docker network if not exists
      shell: docker network create pmm-network
      when:
        - pmm_enabled | bool
        - docker_networks.stdout_lines == []

    - name: Get list of existing containers
      command: docker ps -a --format {{ '{{.Names}}' }}
      register: docker_containers
      when: pmm_enabled | bool

    - name: Set facts for container existence
      set_fact:
        renderer_exists: "{{ 'renderer' in docker_containers.stdout_lines }}"
        pmm_server_exists: "{{ 'pmm-server' in docker_containers.stdout_lines }}"
        watchtower_exists: "{{ 'watchtower' in docker_containers.stdout_lines }}"
      when: pmm_enabled | bool

    - name: Run Watchtower container
      shell: >
        docker run -d --network=pmm-network --name watchtower --restart always
        -e WATCHTOWER_HTTP_API_TOKEN={{ watchtower_token }}
        -e WATCHTOWER_HTTP_API_UPDATE=1
        --volume /var/run/docker.sock:/var/run/docker.sock
        percona/watchtower:latest
      when:
        - pmm_enabled | bool
        - not watchtower_exists

    - name: Run Grafana renderer container
      shell: >
        docker run -d --network=pmm-network --name renderer --restart always
        -e IGNORE_HTTPS_ERRORS=true
        grafana/grafana-image-renderer:latest
      when:
        - pmm_enabled | bool
        - not renderer_exists
      
    - name: Create PMM data volume if not exists
      shell: docker volume create pmm-data
      register: volume_output
      changed_when: "'pmm-data' in volume_output.stdout"
      when: pmm_enabled | bool

    - name: Run PMM server container
      shell: >
        docker run -d --network=pmm-network --name pmm-server --restart always
        -p {{ pmm_external_port }}:{{ pmm_port }}
        --volume pmm-data:/srv
        -e GF_RENDERING_SERVER_URL=http://renderer:8081/render
        -e GF_RENDERING_CALLBACK_URL=https://pmm-server:{{ pmm_port }}/graph/
        -e PMM_WATCHTOWER_HOST=http://watchtower:8080
        -e PMM_WATCHTOWER_TOKEN={{ watchtower_token }}
        {{ pmm_image }}
      when:
        - pmm_enabled | bool
        - not pmm_server_exists

    - name: Wait until PMM server is healthy
      uri:
        url: "https://127.0.0.1:{{ pmm_external_port }}/v1/readyz"
        method: GET
        validate_certs: no  # set to 'yes' if using valid TLS certs
      register: pmm_ready
      until: pmm_ready.status == 200
      retries: 20
      delay: 2
      when: pmm_enabled | bool

    - name: Configure PMM server admin password
      shell: >
        docker exec -t pmm-server change-admin-password {{ pmm_server_pwd }}
      when:
        - pmm_enabled | bool
        - not pmm_server_exists
