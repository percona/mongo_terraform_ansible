---
- name: Add the shards to the cluster
  hosts: shards
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  tags: add_shards
  tasks:
    - name: Set cluster default read/write concern
      shell: |
        echo 'db.adminCommand({
          "setDefaultRWConcern" : 1,
          "defaultWriteConcern" : { "w" : 1 },
          "defaultReadConcern" : { "level" : "local" }
        })' | mongosh admin {% if use_tls | bool %}--tls --tlsCertificateKeyFile {{ clientCertificateKeyFile }} --tlsCAFile {{ CAFile }} --tlsAllowInvalidCertificates{% endif %} -u {{ mongo_admin_user }} -p {{ mongo_admin_password }} --port {{ mongos_port }} --host {{ groups.mongos | first }}
      no_log: true
      delegate_to: "{{ groups.mongos | first }}"
      run_once: true

    - name: Add the shards to the cluster
      shell: |
        mongosh admin {% if use_tls | bool %}--tls --tlsCertificateKeyFile {{ clientCertificateKeyFile }} --tlsCAFile {{ CAFile }} --tlsAllowInvalidCertificates{% endif %} -u {{ mongo_admin_user }} -p {{ mongo_admin_password }} --port {{ mongos_port }} --host {{ groups.mongos | first }} --eval '
          const shardName = "{{ cluster }}-{{ group_names[0] }}";
          const shardConn = shardName + "/{{ ansible_facts["fqdn"] }}:{{ mongo_port }}";
          if (!db.adminCommand({ listShards: 1 }).shards.some(s => s._id === shardName)) {
            sh.addShard(shardConn);
          } else {
            print("Shard " + shardName + " is already registered, skipping.");
          }
        '
      no_log: true
      delegate_to: "{{ groups.mongos | first }}"
      when: mongodb_primary is defined and mongodb_primary
