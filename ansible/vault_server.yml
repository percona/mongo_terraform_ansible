---
- name: Prepare the environment key service
  hosts: vault
  become: true
  tags: vault
  vars:
    vault_api: https://127.0.0.1:8200/v1
    vault_topologies: "{{ vault_topologies_json | default('[]') | from_json }}"
    vault_recovery: "{{ lookup('file', vault_controller_dir ~ '/init.json', errors='ignore') | default('{}', true) | from_json }}"
  tasks:
    - name: Validate Vault environment identity
      assert:
        that:
          - vault_environment is defined
          - vault_environment is match('^[A-Za-z0-9_-]+$')
          - vault_server is defined
          - vault_topologies | length > 0

    - name: Install Vault dependencies
      package:
        name: [unzip, openssl]
        state: present

    - name: Create Vault account
      user:
        name: vault
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create Vault directories
      file:
        path: "{{ item }}"
        state: directory
        owner: vault
        group: vault
        mode: '0700'
      loop: [/etc/vault.d, /opt/vault, /opt/vault/data, /etc/vault.d/tokens]

    - name: Normalize Vault download architecture
      set_fact:
        vault_download_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts.get('architecture', ''), '') }}"

    - name: Validate Vault download architecture
      assert:
        that:
          - vault_download_architecture in ['amd64', 'arm64']
        fail_msg: "Vault's pinned Linux binary does not support architecture {{ ansible_facts.get('architecture', 'unknown') }}."

    - name: Download pinned Vault binary
      get_url:
        url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_{{ vault_download_architecture }}.zip"
        dest: "/opt/vault/vault-{{ vault_version }}.zip"
        mode: '0600'
        checksum: "sha256:https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_SHA256SUMS"

    - name: Install pinned Vault binary
      unarchive:
        src: "/opt/vault/vault-{{ vault_version }}.zip"
        dest: /usr/local/bin
        remote_src: true
      notify: Restart Vault

    - name: Generate environment Vault certificate
      command:
        argv:
          - openssl
          - req
          - -x509
          - -nodes
          - -newkey
          - rsa:2048
          - -days
          - '3650'
          - -subj
          - "/CN={{ vault_environment }}-vault"
          - -addext
          - "subjectAltName=DNS:{{ vault_environment }}-vault,IP:127.0.0.1,IP:{{ vault_server }}"
          - -keyout
          - /etc/vault.d/vault.key
          - -out
          - /etc/vault.d/vault.crt
        creates: /etc/vault.d/vault.crt
      notify: Restart Vault

    - name: Protect Vault TLS files
      file:
        path: "/etc/vault.d/{{ item }}"
        owner: vault
        group: vault
        mode: '0600'
      loop: [vault.key, vault.crt]

    - name: Configure Vault
      template:
        src: templates/vault.hcl.j2
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: '0600'
      notify: Restart Vault

    - name: Install Vault service
      copy:
        dest: /etc/systemd/system/vault.service
        mode: '0644'
        content: |
          [Unit]
          Description=Environment Vault key service
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=vault
          Group=vault
          ExecStart=/usr/local/bin/vault server -config=/etc/vault.d/vault.hcl
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
      notify: Restart Vault

    - name: Apply Vault configuration changes
      meta: flush_handlers

    - name: Start Vault
      systemd:
        name: vault
        state: started
        enabled: true
        daemon_reload: true

    - name: Create private controller recovery directory
      file:
        path: "{{ vault_controller_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Fetch Vault trust certificate
      fetch:
        src: /etc/vault.d/vault.crt
        dest: "{{ vault_controller_dir }}/vault.crt"
        flat: true

    - name: Check Vault initialization
      uri:
        url: "{{ vault_api }}/sys/init"
        ca_path: /etc/vault.d/vault.crt
        return_content: true
      register: vault_init_status
      retries: 30
      delay: 2
      until: vault_init_status.status | default(0) == 200

    - name: Protect an existing controller recovery record
      assert:
        that: vault_recovery.root_token is not defined
        fail_msg: "An uninitialized Vault has existing controller recovery material. Restore its data; do not replace the keys."
      when: not vault_init_status.json.initialized

    - name: Initialize a new Vault
      uri:
        url: "{{ vault_api }}/sys/init"
        method: PUT
        ca_path: /etc/vault.d/vault.crt
        body_format: json
        body: {secret_shares: 5, secret_threshold: 3}
        return_content: true
      register: vault_initialized
      when: not vault_init_status.json.initialized
      no_log: true

    - name: Persist recovery material before unsealing
      copy:
        dest: "{{ vault_controller_dir }}/init.json"
        content: "{{ vault_initialized.json | to_nice_json }}"
        mode: '0600'
      delegate_to: localhost
      become: false
      when: not vault_init_status.json.initialized
      no_log: true

    - name: Require controller recovery material for an existing Vault
      assert:
        that:
          - vault_recovery.root_token is defined
          - vault_recovery.keys_base64 is defined
        fail_msg: "Vault is initialized but controller recovery material is missing. Restore init.json; do not reinitialize Vault."

    - name: Check seal status
      uri:
        url: "{{ vault_api }}/sys/seal-status"
        ca_path: /etc/vault.d/vault.crt
      register: vault_seal_status

    - name: Reset an interrupted unseal attempt
      uri:
        url: "{{ vault_api }}/sys/unseal"
        method: PUT
        ca_path: /etc/vault.d/vault.crt
        body_format: json
        body: {reset: true}
      when: vault_seal_status.json.sealed

    - name: Unseal using controller-held shares
      uri:
        url: "{{ vault_api }}/sys/unseal"
        method: PUT
        ca_path: /etc/vault.d/vault.crt
        body_format: json
        body:
          key: "{{ item }}"
      loop: "{{ vault_recovery.keys_base64[:3] }}"
      when: vault_seal_status.json.sealed
      no_log: true

    - name: Verify Vault is unsealed
      uri:
        url: "{{ vault_api }}/sys/health"
        ca_path: /etc/vault.d/vault.crt

    - name: Inspect mounted secret engines
      uri:
        url: "{{ vault_api }}/sys/mounts"
        ca_path: /etc/vault.d/vault.crt
        headers: {X-Vault-Token: "{{ vault_recovery.root_token }}"}
      register: vault_mounts
      no_log: true

    - name: Enable KV v2
      uri:
        url: "{{ vault_api }}/sys/mounts/secret"
        method: POST
        ca_path: /etc/vault.d/vault.crt
        headers: {X-Vault-Token: "{{ vault_recovery.root_token }}"}
        body_format: json
        body: {type: kv, options: {version: '2'}}
        status_code: 204
      when: "'secret/' not in vault_mounts.json.data"
      no_log: true

    - name: Validate existing KV mount
      assert:
        that: "vault_mounts.json.data['secret/'].options.version == '2'"
      when: "'secret/' in vault_mounts.json.data"

    - name: Retain master key versions
      uri:
        url: "{{ vault_api }}/secret/config"
        method: POST
        ca_path: /etc/vault.d/vault.crt
        headers: {X-Vault-Token: "{{ vault_recovery.root_token }}"}
        body_format: json
        body: {max_versions: 10000}
        status_code: 204
      no_log: true

    - name: Validate topology secret namespace
      assert:
        that: vault_token_topology is match('^(cluster|replset)-[A-Za-z0-9_-]+$')
      loop: "{{ vault_topologies }}"
      loop_control:
        loop_var: vault_token_topology

    - name: Write topology Vault policies
      uri:
        url: "{{ vault_api }}/sys/policies/acl/{{ vault_token_topology }}"
        method: PUT
        ca_path: /etc/vault.d/vault.crt
        headers: {X-Vault-Token: "{{ vault_recovery.root_token }}"}
        body_format: json
        body:
          policy: |
            path "secret/data/{{ vault_token_topology }}/*" {
              capabilities = ["create", "read", "update"]
            }
            path "secret/metadata/{{ vault_token_topology }}/*" {
              capabilities = ["read"]
            }
            path "secret/config" { capabilities = ["read"] }
            path "auth/token/lookup-self" { capabilities = ["read"] }
            path "auth/token/renew-self" { capabilities = ["update"] }
        status_code: 204
      loop: "{{ vault_topologies }}"
      loop_control:
        loop_var: vault_token_topology
      no_log: true

    - name: Load existing topology tokens from controller
      set_fact:
        vault_existing_tokens: "{{ vault_existing_tokens | default({}) | combine({vault_token_topology: (lookup('file', vault_controller_dir ~ '/' ~ vault_token_topology ~ '.token', errors='ignore') | default('', true) | trim)}) }}"
      loop: "{{ vault_topologies }}"
      loop_control:
        loop_var: vault_token_topology
      no_log: true

    - name: Renew existing topology tokens
      uri:
        url: "{{ vault_api }}/auth/token/renew-self"
        method: POST
        ca_path: /etc/vault.d/vault.crt
        headers: {X-Vault-Token: "{{ vault_existing_tokens[vault_token_topology] }}"}
        status_code: [200, 400, 403]
      register: vault_token_renewals
      loop: "{{ vault_topologies }}"
      loop_control:
        loop_var: vault_token_topology
      when: vault_existing_tokens[vault_token_topology] | length > 0
      no_log: true

    - name: Create missing or expired topology tokens
      uri:
        url: "{{ vault_api }}/auth/token/create-orphan"
        method: POST
        ca_path: /etc/vault.d/vault.crt
        headers: {X-Vault-Token: "{{ vault_recovery.root_token }}"}
        body_format: json
        body:
          policies: ["{{ vault_token_topology }}"]
          no_default_policy: true
          period: 720h
          display_name: "mongodb-{{ vault_token_topology }}"
      register: vault_token_creations
      loop: "{{ vault_topologies }}"
      loop_control:
        loop_var: vault_token_topology
      when: >-
        vault_existing_tokens[vault_token_topology] | length == 0 or
        (vault_token_renewals.results | selectattr('item', 'equalto', vault_token_topology) | first).status | default(0) != 200
      no_log: true

    - name: Persist topology tokens on controller
      copy:
        dest: "{{ vault_controller_dir }}/{{ vault_token_topology }}.token"
        content: >-
          {{ (vault_token_creations.results | selectattr('item', 'equalto', vault_token_topology) | selectattr('skipped', 'undefined') | map(attribute='json.auth.client_token') | first)
             | default(vault_existing_tokens[vault_token_topology]) }}
        mode: '0600'
      delegate_to: localhost
      become: false
      loop: "{{ vault_topologies }}"
      loop_control:
        loop_var: vault_token_topology
      no_log: true

    - name: Install topology tokens for renewal on Vault
      copy:
        dest: "/etc/vault.d/tokens/{{ vault_token_topology }}.token"
        content: >-
          {{ (vault_token_creations.results | selectattr('item', 'equalto', vault_token_topology) | selectattr('skipped', 'undefined') | map(attribute='json.auth.client_token') | first)
             | default(vault_existing_tokens[vault_token_topology]) }}
        owner: root
        mode: '0600'
      loop: "{{ vault_topologies }}"
      loop_control:
        loop_var: vault_token_topology
      no_log: true

    - name: Record encrypted topology modes for Terraform validation
      copy:
        dest: "{{ vault_controller_dir }}/topologies.json"
        content: "{{ dict(vault_topologies | zip([true] * (vault_topologies | length))) | to_nice_json }}"
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Install scoped token renewal script
      copy:
        dest: /usr/local/bin/vault-renew-mongodb
        mode: '0700'
        content: |
          #!/bin/sh
          set -eu
          export VAULT_ADDR=https://127.0.0.1:8200
          export VAULT_CACERT=/etc/vault.d/vault.crt
          failed=0
          for file in /etc/vault.d/tokens/*.token; do
            [ -f "$file" ] || continue
            VAULT_TOKEN="$(cat "$file")" /usr/local/bin/vault token renew >/dev/null 2>&1 || failed=1
          done
          exit "$failed"

    - name: Install token renewal service
      copy:
        dest: /etc/systemd/system/vault-renew-mongodb.service
        mode: '0644'
        content: |
          [Unit]
          Description=Renew scoped MongoDB Vault tokens
          After=vault.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/vault-renew-mongodb

    - name: Install daily token renewal timer
      copy:
        dest: /etc/systemd/system/vault-renew-mongodb.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Renew MongoDB Vault credentials daily
          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=1d
          [Install]
          WantedBy=timers.target

    - name: Enable token renewal
      systemd:
        name: vault-renew-mongodb.timer
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart Vault
      systemd:
        name: vault
        state: restarted
        daemon_reload: true
