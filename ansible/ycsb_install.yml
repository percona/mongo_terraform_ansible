---
- name: Install YCSB workload generator
  hosts: ycsb
  become: yes
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  tasks:
    - name: Define Java runtime package for the current OS family
      set_fact:
        ycsb_java_package: "{{ 'default-jdk-headless' if ansible_facts['os_family'] == 'Debian' else 'java-17-openjdk-devel' }}"
        ycsb_python_package: "{{ 'python-is-python3' if ansible_facts['os_family'] == 'Debian' else 'python3' }}"

    - name: Install Java runtime and tools on Debian/Ubuntu
      apt:
        name:
          - curl
          - tar
          - gzip
          - git
          - "{{ ycsb_python_package }}"
          - "{{ ycsb_java_package }}"
        state: present
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install Java runtime and tools on non-Debian systems
      package:
        name:
          - curl
          - tar
          - gzip
          - git
          - "{{ ycsb_python_package }}"
          - "{{ ycsb_java_package }}"
        state: present
      when: ansible_facts['os_family'] != 'Debian'

    - name: Ensure python command is available on non-Debian systems
      file:
        src: /usr/bin/python3
        dest: /usr/bin/python
        state: link
      when: ansible_facts['os_family'] != 'Debian'

    - name: Install Maven version required by the YCSB source build
      unarchive:
        src: "https://archive.apache.org/dist/maven/maven-3/{{ ycsb_maven_version }}/binaries/apache-maven-{{ ycsb_maven_version }}-bin.tar.gz"
        dest: /opt
        remote_src: yes
        creates: "/opt/apache-maven-{{ ycsb_maven_version }}/bin/mvn"

    - name: Read installed YCSB source revision
      command: cat /opt/ycsb/.source-revision
      register: ycsb_installed_revision
      changed_when: false
      failed_when: false

    - name: Fetch pinned YCSB source
      git:
        repo: https://github.com/brianfrankcooper/YCSB.git
        dest: /opt/ycsb-source
        version: "{{ ycsb_source_revision }}"
        force: yes

    - name: Build and install pinned YCSB MongoDB binding
      shell: |
        /opt/apache-maven-{{ ycsb_maven_version }}/bin/mvn -pl mongodb -am -DskipTests package
        rm -rf /opt/ycsb
        mkdir -p /opt/ycsb
        tar -xzf mongodb/target/ycsb-mongodb-binding-*.tar.gz -C /opt/ycsb --strip-components=1
        printf '%s\n' '{{ ycsb_source_revision }}' > /opt/ycsb/.source-revision
      args:
        chdir: /opt/ycsb-source
      when: ycsb_installed_revision.stdout != ycsb_source_revision

    - name: Ensure YCSB profile is available for interactive shells
      copy:
        dest: /etc/profile.d/ycsb.sh
        mode: "0644"
        content: |
          export YCSB_HOME=/opt/ycsb
          export PATH=$PATH:/opt/ycsb/bin

    - name: Verify YCSB installation
      command: /opt/ycsb/bin/ycsb --help
      changed_when: false
