<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MongoDB Deploy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="{{ url_for('index') }}">
      <span class="logo-icon">🍃</span> MongoDB Deploy UI
    </a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}">Environments</a>
      <a href="{{ url_for('new_environment') }}" class="btn btn-primary btn-sm">+ New</a>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
